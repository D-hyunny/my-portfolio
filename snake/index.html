<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스네이크 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <h1>스네이크 게임</h1>

        <div class="scoreboard">
            <div class="score-item">
                <span class="score-label">점수</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">레벨</span>
                <span id="level" class="score-value">1</span>
            </div>
            <div class="score-item">
                <span class="score-label">최고 점수</span>
                <span id="high-score" class="score-value">0</span>
            </div>
        </div>

        <div class="difficulty">
            <label for="difficulty">난이도</label>
            <select id="difficulty">
                <option value="200">쉬움</option>
                <option value="150" selected>보통</option>
                <option value="100">어려움</option>
                <option value="50">매우 어려움</option>
            </select>
        </div>

        <div class="board">
            <canvas id="game-canvas" width="400" height="400"></canvas>

            <div id="game-over" class="overlay" hidden>
                <p class="overlay-title">게임 오버</p>
                <p class="overlay-score">점수: <span id="final-score">0</span></p>
                <button type="button" id="restart-btn">다시 시작</button>
            </div>
        </div>

        <div class="controls">
            <button type="button" id="start-btn">게임 시작</button>
            <button type="button" id="pause-btn" disabled>일시정지</button>
        </div>
        <p class="hint">방향키로 뱀을 조종하세요.</p>
    </main>

    <script src="main.js"></script>
</body>
</html>
